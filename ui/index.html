<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>cjnote — AI 笔记</title>
<style>
/*__VENDOR_CSS__*/
</style>
<style>
:root {
  --bg: #1e2229; --bg2: #262b34; --bg3: #2d3340;
  --fg: #d8dee6; --fg-dim: #8b93a3; --accent: #4f9cf9;
  --border: #363d4a; --ok: #58c288; --warn: #e0b25a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--fg); font-size: 14px;
  display: flex; flex-direction: column;
}
/* ── 顶栏 ── */
#topbar {
  flex: 0 0 auto; height: 44px; display: flex; align-items: center; gap: 10px;
  padding: 0 14px; background: var(--bg2); border-bottom: 1px solid var(--border);
}
#topbar .logo { font-weight: 600; color: var(--accent); }
#topbar .doc-title { color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#topbar .spacer { flex: 1 1 auto; }
#topbar button {
  background: var(--bg3); color: var(--fg); border: 1px solid var(--border);
  border-radius: 5px; padding: 4px 12px; cursor: pointer; font-size: 13px;
}
#topbar button:hover { border-color: var(--accent); }
/* ── 三栏 ── */
#main { flex: 1 1 auto; display: flex; min-height: 0; }
#sidebar {
  flex: 0 0 220px; display: flex; flex-direction: column;
  background: var(--bg2); border-right: 1px solid var(--border); min-height: 0;
}
#sidebar .head {
  flex: 0 0 auto; padding: 10px 12px 6px; color: var(--fg-dim);
  font-size: 12px; letter-spacing: 1px; display: flex; align-items: center; justify-content: space-between;
}
#sidebar .head button { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 16px; }
#note-list { flex: 1 1 auto; overflow-y: auto; padding: 4px 6px; }
.note-item {
  padding: 7px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg-dim);
}
.note-item:hover { background: var(--bg3); }
.note-item.active { background: var(--bg3); color: var(--fg); border-left: 2px solid var(--accent); }
/* 中栏：编辑 + 预览 */
#work { flex: 1 1 auto; display: flex; min-width: 0; min-height: 0; }
#editor-pane, #preview-pane { flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column; }
#preview-pane { border-left: 1px solid var(--border); }
.pane-tip { flex: 0 0 auto; padding: 4px 12px; font-size: 11px; color: var(--fg-dim); background: var(--bg2); }
#editor-wrap { flex: 1 1 auto; min-height: 0; }
#editor-wrap .CodeMirror { height: 100%; }
#editor-fallback {
  width: 100%; height: 100%; border: none; resize: none; outline: none;
  background: var(--bg); color: var(--fg); padding: 12px; font: 14px/1.6 monospace; display: none;
}
#preview { flex: 1 1 auto; overflow-y: auto; padding: 16px 22px; line-height: 1.7; }
#preview h1, #preview h2, #preview h3 { margin: 14px 0 8px; color: #e8edf4; }
#preview p { margin: 8px 0; }
#preview pre { background: var(--bg3); padding: 10px 12px; border-radius: 6px; overflow-x: auto; margin: 10px 0; }
#preview code { font-family: Consolas, monospace; font-size: 13px; }
#preview p code, #preview li code { background: var(--bg3); padding: 1px 5px; border-radius: 4px; }
#preview ul, #preview ol { padding-left: 24px; margin: 8px 0; }
#preview blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--fg-dim); margin: 8px 0; }
#preview a { color: var(--accent); }
#preview table { border-collapse: collapse; margin: 10px 0; }
#preview th, #preview td { border: 1px solid var(--border); padding: 5px 10px; }
#preview img { max-width: 100%; }
/* ── AI 侧栏 ── */
#ai {
  flex: 0 0 320px; display: flex; flex-direction: column; min-height: 0;
  background: var(--bg2); border-left: 1px solid var(--border);
}
#ai .head {
  flex: 0 0 auto; padding: 10px 12px; font-size: 12px; letter-spacing: 1px;
  color: var(--fg-dim); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
#ai .head .state { color: var(--warn); }
#ai-msgs { flex: 1 1 auto; overflow-y: auto; padding: 12px; }
.ai-empty { color: var(--fg-dim); font-size: 13px; line-height: 1.8; padding: 8px; }
#ai-input-row {
  flex: 0 0 auto; display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border);
}
#ai-input {
  flex: 1 1 auto; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
  color: var(--fg); padding: 8px 10px; font-size: 13px; outline: none; resize: none; height: 40px;
}
#ai-input:focus { border-color: var(--accent); }
#ai-send {
  flex: 0 0 auto; background: var(--accent); color: #fff; border: none; border-radius: 6px;
  padding: 0 14px; cursor: pointer; font-size: 13px;
}
#ai-send:disabled { opacity: 0.4; cursor: default; }
/* AI 消息气泡 */
.msg { margin-bottom: 10px; padding: 7px 10px; border-radius: 8px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; font-size: 13px; }
.msg.user { background: var(--bg3); margin-left: 18px; }
.msg.assistant { background: transparent; border: 1px solid var(--border); margin-right: 6px; }
.msg .who { font-size: 11px; color: var(--fg-dim); margin-bottom: 3px; }
.msg.err { border-color: var(--warn); }
.ai-hint { font-size: 12px; color: var(--fg-dim); padding: 4px 8px; }
/* 设置面板 */
#ai-setup { padding: 12px; font-size: 12px; }
#ai-setup label { display: block; color: var(--fg-dim); margin: 8px 0 3px; }
#ai-setup input {
  width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 5px;
  color: var(--fg); padding: 6px 8px; font-size: 12px; outline: none;
}
#ai-setup input:focus { border-color: var(--accent); }
#ai-setup .save-row { margin-top: 10px; text-align: right; }
#ai-setup button {
  background: var(--accent); color: #fff; border: none; border-radius: 5px;
  padding: 5px 14px; cursor: pointer; font-size: 12px;
}
/* 顶栏右侧缩放补偿（AGENTS §4 zoom 坑：本页不缩放，占位说明） */
</style>
</head>
<body>
<div id="topbar">
  <span class="logo">cjnote</span>
  <span class="doc-title" id="doc-title">（未打开）</span>
  <span class="spacer"></span>
  <button id="btn-save" title="Ctrl+S">保存</button>
  <button id="btn-new">新建</button>
</div>
<div id="main">
  <div id="sidebar">
    <div class="head"><span>笔记</span><button id="btn-refresh" title="刷新列表">⟳</button></div>
    <div id="note-list"></div>
  </div>
  <div id="work">
    <div id="editor-pane">
      <div class="pane-tip">编辑（Markdown）</div>
      <div id="editor-wrap"></div>
      <textarea id="editor-fallback" spellcheck="false"></textarea>
    </div>
    <div id="preview-pane">
      <div class="pane-tip">预览（实时）</div>
      <div id="preview"></div>
    </div>
  </div>
  <div id="ai">
    <div class="head"><span>AI 助手</span><span class="state" id="ai-state">未配置</span></div>
    <div id="ai-msgs"></div>
    <div id="ai-input-row">
      <textarea id="ai-input" placeholder="问点什么…（Enter 发送）"></textarea>
      <button id="ai-send">发送</button>
    </div>
  </div>
</div>
<script>
/*__VENDOR_JS__*/
</script>
<script>
"use strict";
// ── 桥等待（模板惯例）：内联页面初始化不抢在桥注入之前 ──
function waitForBridge(cb, tries) {
  if (window.__CJ_TAURI__ && typeof window.__CJ_TAURI__.invoke === "function") { cb(); return; }
  if (tries <= 0) { document.getElementById("doc-title").textContent = "桥未就绪（重启应用）"; return; }
  setTimeout(function () { waitForBridge(cb, tries - 1); }, 100);
}

var bridge = null;
var cm = null;                      // CodeMirror 实例；null = fallback textarea
var notes = [];                     // [{name, path}]
var current = "";                   // 当前笔记文件名
var dirty = false;

function $(id) { return document.getElementById(id); }

// ── 编辑器：CodeMirror 优先，缺失退化 textarea（vendor 内联失败不致命） ──
function initEditor() {
  var wrap = $("editor-wrap");
  if (window.CodeMirror) {
    cm = window.CodeMirror(wrap, {
      value: "", lineNumbers: true, lineWrapping: true,
      mode: "text/x-markdown", theme: "default",
      extraKeys: { "Ctrl-S": function () { saveCurrent(); } }
    });
    cm.on("change", function () { dirty = true; renderPreview(cm.getValue()); });
  } else {
    var ta = $("editor-fallback");
    ta.style.display = "block";
    wrap.style.display = "none";
    ta.addEventListener("input", function () { dirty = true; renderPreview(ta.value); });
    document.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); saveCurrent(); }
    });
  }
}
function getDoc() { return cm ? cm.getValue() : $("editor-fallback").value; }
function setDoc(text) {
  if (cm) { cm.setValue(text); } else { $("editor-fallback").value = text; }
  renderPreview(text); dirty = false;
}

// ── 预览：marked 优先，缺失退化为纯文本 ──
function renderPreview(md) {
  var out = $("preview");
  if (window.marked) {
    try { out.innerHTML = window.marked.parse(md); }
    catch (e) { out.textContent = md; }
  } else { out.textContent = md; }
  if (window.hljs) {
    var blocks = out.querySelectorAll("pre code");
    for (var i = 0; i < blocks.length; i++) { try { window.hljs.highlightElement(blocks[i]); } catch (err) {} }
  }
}

// ── IPC 封装 ──
function invoke(cmd, args) {
  return bridge.invoke(cmd, args || {});
}
function report(line) {
  eprintlnShim(line);
  try { invoke("report", { line: line }); } catch (e) {}
}
function eprintlnShim(line) { console.log(line); }

// ── AI 侧栏（M3）：直连 chat/completions 流式对话 ──
// 管道形状照 ai-chat 实测结论：http:chunk 只给字节增量（emitLatest 保最新），
// 监听必须先于 invoke 挂；SSE 帧解析在前端全量重解（简单无状态，几十 KB 无感）。
var aiCfg = { base: "", key: "", model: "" };
var aiStreaming = false;
var aiHistory = [];   // [{role, content}]（不含 system）

function aiMsgEl(role, text, streaming) {
  var box = $("ai-msgs");
  var el = document.createElement("div");
  el.className = "msg " + role + (role === "assistant" && text.indexOf("**[错误]**") === 0 ? " err" : "");
  var who = document.createElement("div");
  who.className = "who";
  who.textContent = role === "user" ? "我" : "AI";
  var bodyEl = document.createElement("div");
  bodyEl.className = "body";
  if (text) { bodyEl.textContent = text; }
  el.appendChild(who);
  el.appendChild(bodyEl);
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
  return el;
}
function aiSetBody(el, text) {
  var b = el.querySelector(".body");
  if (b) { b.textContent = text; }
  el.className = "msg assistant" + (text.indexOf("**[错误]**") === 0 ? " err" : "");
  var box = $("ai-msgs");
  box.scrollTop = box.scrollHeight;
}
// SSE 帧 → 纯文本（OpenAI 兼容）：data: 行取 JSON 拼 delta，[DONE] 收，半截 JSON 等下一轮
function sseToText(acc) {
  var out = "";
  var lines = acc.split("\n");
  for (var i = 0; i < lines.length; i++) {
    var t = lines[i].trim();
    if (t.indexOf("data:") !== 0) { continue; }
    var d = t.slice(5).trim();
    if (!d || d === "[DONE]") { continue; }
    try {
      var j = JSON.parse(d);
      var ch = j.choices && j.choices[0];
      var delta = ch && ch.delta && ch.delta.content;
      if (typeof delta === "string") { out += delta; }
      if (j.error && j.error.message) { out += "\n\n[服务端错误] " + j.error.message; }
    } catch (e) { /* 块边界上的半截 JSON：下一轮全量重解自然补上 */ }
  }
  return out;
}
function aiSend() {
  if (aiStreaming) { return; }
  var input = $("ai-input");
  var text = input.value.trim();
  if (!text) { return; }
  if (!aiCfg.base || !aiCfg.model) {
    aiShowSetup("先配置 AI 服务（Base URL / API Key / 模型名）");
    return;
  }
  input.value = "";
  aiHistory.push({ role: "user", content: text });
  aiMsgEl("user", text);
  aiStreaming = true;
  $("ai-send").textContent = "…";
  $("ai-state").textContent = "回复中";
  // 占位气泡（创建一次不再重绘）+ 累积流
  var body = aiMsgEl("assistant", "", true);
  var acc = "";
  // 监听先于 invoke（块可能立刻到达）
  var off = bridge.listen("http:chunk", function (p) {
    if (p.done) { return; }
    acc += p.delta || "";
    aiSetBody(body, sseToText(acc));
  });
  var payload = JSON.stringify({
    model: aiCfg.model,
    messages: [{ role: "system", content: "你是 cjnote 的写作助手，回答简洁、适合放进步骤笔记。" }].concat(aiHistory),
    stream: true
  });
  invoke("http:postStream", {
    url: aiCfg.base,
    body: payload,
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + aiCfg.key }
  }).then(function (stat) {
    off();
    // 空回复必须可见：一条 data: 行都没有 ≠ 成功——多半是端点/白名单不对（ai-chat 实测教训）
    var full = sseToText(acc);
    if (full === "") {
      full = "**[错误]** 没有收到任何流式内容（HTTP " + (stat && stat.status ? stat.status : "?") +
        "，共 " + (stat && stat.received ? stat.received : 0) + " 字节）。" +
        "检查 Base URL 是否为完整的 chat/completions 端点、是否在 http 白名单内。";
    }
    aiHistory.push({ role: "assistant", content: full });
    aiSetBody(body, full);
    aiStreaming = false;
    $("ai-send").textContent = "发送";
    $("ai-state").textContent = "就绪";
  }).catch(function (e) {
    off();
    var msg = "**[错误]** 请求失败：" + (e && e.message ? e.message : String(e));
    aiHistory.push({ role: "assistant", content: msg });
    aiSetBody(body, msg);
    aiStreaming = false;
    $("ai-send").textContent = "发送";
    $("ai-state").textContent = "出错";
  });
}
// 设置面板（配置链路 #3 接 store 持久化后启用）
function aiShowSetup(msg) {
  var box = $("ai-msgs");
  box.innerHTML = "";
  var setup = document.createElement("div");
  setup.id = "ai-setup";
  setup.innerHTML =
    (msg ? '<div class="ai-hint">' + msg + "</div>" : "") +
    '<label>Base URL（完整 chat/completions 端点）</label>' +
    '<input id="cfg-base" placeholder="https://api.deepseek.com/chat/completions">' +
    '<label>API Key</label>' +
    '<input id="cfg-key" type="password" placeholder="sk-…">' +
    '<label>模型名</label>' +
    '<input id="cfg-model" placeholder="deepseek-chat">' +
    '<div class="save-row"><button id="cfg-save">保存</button></div>';
  box.appendChild(setup);
  $("cfg-base").value = aiCfg.base;
  $("cfg-key").value = aiCfg.key;
  $("cfg-model").value = aiCfg.model;
  $("cfg-save").onclick = function () {
    aiCfg.base = $("cfg-base").value.trim();
    aiCfg.key = $("cfg-key").value.trim();
    aiCfg.model = $("cfg-model").value.trim();
    aiSaveCfg().then(function () {
      box.innerHTML = "";
      $("ai-state").textContent = aiCfg.base ? "就绪" : "未配置";
      aiMsgEl("assistant", "配置已保存。在左边写笔记，有需要随时问我。");
    });
  };
}
function aiSaveCfg() {
  return invoke("store:set", { key: "ai.config", value: JSON.stringify(aiCfg) }).catch(function (e) {
    report("SELFCHECK FAIL cfg save: " + e);
  });
}
function aiLoadCfg() {
  // 探针配置优先（CJNOTE_PROBE_AI 注入的 window.__CJNOTE_AI_CFG__）：无人值守验证管道用
  if (window.__CJNOTE_AI_CFG__ && window.__CJNOTE_AI_CFG__.base) {
    aiCfg = { base: window.__CJNOTE_AI_CFG__.base, key: window.__CJNOTE_AI_CFG__.key || "probe", model: window.__CJNOTE_AI_CFG__.model || "mock" };
    return Promise.resolve(aiCfg);
  }
  return invoke("store:get", { key: "ai.config" }).then(function (r) {
    // store:get 返回 {value} 或 null（键不存在），两条都收
    if (r && typeof r.value === "string" && r.value) {
      try {
        var j = JSON.parse(r.value);
        if (j && j.base) { aiCfg = { base: j.base || "", key: j.key || "", model: j.model || "" }; }
      } catch (e) {}
    }
    return aiCfg;
  }).catch(function () { return aiCfg; });
}

// ── 笔记列表（M2：走自研 NoteStore，note:list/open/save/create/delete） ──
function refreshList() {
  return invoke("note:list", {}).then(function (r) {
    var items = (r && r.notes) ? r.notes : [];
    notes = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i] && items[i].name) { notes.push(items[i].name); }
    }
    renderList();
    return notes;
  }).catch(function (e) { report("SELFCHECK FAIL list: " + e); });
}
function renderList() {
  var box = $("note-list");
  box.innerHTML = "";
  if (notes.length === 0) {
    var tip = document.createElement("div");
    tip.className = "note-item"; tip.textContent = "（notes/ 目录为空）";
    box.appendChild(tip); return;
  }
  for (var i = 0; i < notes.length; i++) {
    (function (name) {
      var el = document.createElement("div");
      el.className = "note-item" + (name === current ? " active" : "");
      el.textContent = name;
      el.onclick = function () { openNote(name); };
      box.appendChild(el);
    })(notes[i]);
  }
}
function openNote(name) {
  return invoke("note:open", { name: name }).then(function (r) {
    var text = (r && typeof r.body === "string") ? r.body : "";
    current = (r && r.name) ? r.name : name;
    dirty = false;
    $("doc-title").textContent = current;
    setDoc(text);
    renderList();
    report("SELFCHECK PASS open " + current + " bytes=" + text.length);
  }).catch(function (e) { report("SELFCHECK FAIL read " + name + ": " + e); });
}
function saveCurrent() {
  if (!current) { newNote(); return; }
  return invoke("note:save", { name: current, body: getDoc() }).then(function (r) {
    dirty = false;
    if (r && r.name) { current = r.name; }
    $("doc-title").textContent = current;
    report("SELFCHECK PASS save " + current);
  }).catch(function (e) { report("SELFCHECK FAIL save: " + e); });
}
function newNote() {
  return invoke("note:create", {}).then(function (r) {
    var name = (r && r.name) ? r.name : "";
    if (!name) { report("SELFCHECK FAIL create: no name"); return; }
    current = name;
    $("doc-title").textContent = name;
    setDoc("");
    return saveCurrent().then(refreshList).then(function () { openNote(name); });
  }).catch(function (e) { report("SELFCHECK FAIL create: " + e); });
}

// ── 自检（CJNOTE_SELFCHECK=1 时跑一轮，全部经 report 回投 stderr） ──
function selfCheck(env) {
  if (!env || !env.selfcheck) { return; }
  report("SELFCHECK start");
  var pass = 0, fail = 0;
  function ok(cond, name) {
    if (cond) { pass++; report("SELFCHECK PASS " + name); }
    else { fail++; report("SELFCHECK FAIL " + name); }
  }
  ok(!!bridge, "bridge ready");
  ok(!!(cm || $("editor-fallback")), "editor ready");
  ok(!!window.marked, "marked ready");
  refreshList().then(function (list) {
    ok(list.length >= 1, "note list non-empty");
    // 开第一篇、写入、保存、重读——文件落盘闭环
    var target = list[0];
    if (target) {
      openNote(target).then(function () {
        var prev = getDoc();
        setDoc(prev + "\n<!-- probe -->\n");
        saveCurrent().then(function () {
          invoke("note:open", { name: target }).then(function (r) {
            var text = (r && typeof r.body === "string") ? r.body : "";
            ok(text.indexOf("<!-- probe -->") >= 0, "write-read roundtrip");
            setDoc(prev); saveCurrent();
            // AI 流式探针（CJNOTE_PROBE_AI 注入配置时跑）：发一句、收流、断言非空
            if (aiCfg.base && $("ai-state").textContent !== "未配置") {
              $("ai-input").value = "ping";
              aiSend();
              var tries = 0;
              (function waitAi() {
                tries++;
                var done = aiHistory.length >= 2 && aiHistory[aiHistory.length - 1].role === "assistant" &&
                  (aiHistory[aiHistory.length - 1].content.length > 0);
                if (done) {
                  var reply = aiHistory[aiHistory.length - 1].content;
                  ok(reply.indexOf("**[错误]**") !== 0 && reply.length > 0, "ai stream reply non-empty");
                  report("SELFCHECK DONE passed=" + pass + " failed=" + fail);
                } else if (tries > 60) {
                  ok(false, "ai stream reply timeout");
                  report("SELFCHECK DONE passed=" + pass + " failed=" + fail);
                } else {
                  setTimeout(waitAi, 100);
                }
              })();
            } else {
              report("SELFCHECK DONE passed=" + pass + " failed=" + fail);
            }
          }).catch(function (e) { ok(false, "roundtrip read: " + e); report("SELFCHECK DONE passed=" + pass + " failed=" + fail); });
        });
      });
    } else {
      report("SELFCHECK DONE passed=" + pass + " failed=" + fail);
    }
  });
}

// ── 启动 ──
waitForBridge(function () {
  bridge = window.__CJ_TAURI__;
  invoke("notes:env", {}).then(function (env) {
    initEditor();
    document.getElementById("btn-save").onclick = function () { saveCurrent(); };
    document.getElementById("btn-new").onclick = function () { newNote(); };
    document.getElementById("btn-refresh").onclick = function () { refreshList(); };
    document.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === "s" && cm) { e.preventDefault(); saveCurrent(); }
    });
    // AI 侧栏接线：发送按钮 + Enter 发送（Shift+Enter 换行）
    document.getElementById("ai-send").onclick = aiSend;
    document.getElementById("ai-input").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); aiSend(); }
    });
    refreshList().then(function (list) {
      if (list.length > 0) { openNote(list[0]); }
    });
    // 配置链路（#3）：启动即读 store，配置齐则侧栏就绪，缺则弹设置面板
    aiLoadCfg().then(function (cfg) {
      if (cfg.base && cfg.model) {
        $("ai-state").textContent = "就绪";
        aiMsgEl("assistant", "我在。写笔记时有需要随时问我。");
      } else {
        aiShowSetup("");
      }
    });
    selfCheck(env);
  }).catch(function (e) {
    document.getElementById("doc-title").textContent = "notes:env 失败：" + e;
  });
}, 50);
</script>
</body>
</html>
